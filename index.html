<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Günlüğümüz 💌</title>
  <link rel="icon" href="favicon-32x32.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" id="loginScreen">
    <h1>Günlüğümüz 💌</h1>
    <input type="text" id="loginUsername" placeholder="Kullanıcı adın" />
    <input type="password" id="loginPassword" placeholder="Şifren" />
    <button onclick="login()">Giriş Yap</button>
    <p>Hesabın yok mu? <a href="#" onclick="showRegister()">Kayıt ol</a></p>
  </div>

  <div class="container" id="registerScreen" style="display:none;">
    <h1>Yeni Hesap Oluştur</h1>
    <input type="text" id="username" placeholder="Kullanıcı adın" />
    <input type="password" id="password" placeholder="Şifren" />
    <button onclick="register()">Kayıt Ol</button>
    <p>Zaten hesabın var mı? <a href="#" onclick="showLogin()">Giriş yap</a></p>
  </div>

  <div class="container" id="appScreen" style="display:none;">
    <h1 id="welcome"></h1>
    <textarea id="entry" placeholder="Bugün ne hissettin, ne yaşadın?"></textarea>
    <input type="file" id="imageInput" accept="image/*" />
    <button onclick="saveEntry()">Kaydet</button>

    <h2>Eski Yazılar</h2>
    <div id="entries"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
