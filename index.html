<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Günlüğümüz 💌</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" id="loginScreen">
    <h1>Günlüğümüz 💌</h1>
    <input type="text" id="username" placeholder="Kullanıcı adın" />
    <button onclick="login()">Giriş Yap</button>
  </div>

  <div class="container" id="appScreen" style="display:none;">
    <h1 id="welcome"></h1>
    <textarea id="entry" placeholder="Bugün ne hissettin, ne yaşadın?"></textarea>
    <input type="file" id="imageInput" accept="image/*" />
    <button onclick="saveEntry()">Kaydet</button>

    <h2>Eski Yazılar</h2>
    <div id="entries"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
